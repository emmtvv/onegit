# Backing services for the integration tests (see docs/testing.md):
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   make test-integration
#
# Ports are bound to 127.0.0.1 only. Every test gets its own database, Redis
# key prefix and S3 bucket, so test packages can run in parallel.

name: onegit-test-deps

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: onegit
      POSTGRES_PASSWORD: onegit
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onegit -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:latest
    # Every test creates its own bucket, and SeaweedFS gives each bucket its
    # own volumes: allow many small ones.
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json",
              "-master.volumeSizeLimitMB=16", "-master.volumePreallocate=false", "-volume.max=2000"]
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:58333:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

configs:
  s3_identities:
    content: |
      {"identities": [{"name": "onegit",
        "credentials": [{"accessKey": "onegit", "secretKey": "onegit-test-secret"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
