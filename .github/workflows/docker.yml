name: Docker image

# Builds the multi-platform image and pushes it to Docker Hub. Called by
# ci.yml (pushes to main → "edge") and release.yml (version tags → "1.2.3",
# "1.2", "latest"). Tags follow the ref that triggered the caller.
#
# Repository settings:
#   secrets DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (an access token with
#   read/write scope, Docker Hub → Account settings → Personal access tokens)
#   variable DOCKERHUB_IMAGE (optional, default emmtvv/onegit)

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Go build cross-compiles; emulation is only needed for the
      # runtime stage's package install.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_IMAGE || 'emmtvv/onegit' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=onegit
            org.opencontainers.image.description=A self-hosted git server for one monorepo: code, pull requests, CI, deployments and a container registry.
            org.opencontainers.image.licenses=Apache-2.0

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
