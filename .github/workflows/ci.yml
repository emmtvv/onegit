name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs the same checks before publishing a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Integration tests need Postgres, Redis and S3; they come from
      # docker-compose.test.yml. ONEGIT_TEST_REQUIRE turns a missing service
      # into a failure instead of a skip.
      ONEGIT_TEST_POSTGRES: postgres://onegit:onegit@127.0.0.1:55432/postgres?sslmode=disable
      ONEGIT_TEST_REDIS: redis://127.0.0.1:56379/0
      ONEGIT_TEST_S3: http://127.0.0.1:58333
      ONEGIT_TEST_S3_ACCESS_KEY: onegit
      ONEGIT_TEST_S3_SECRET_KEY: onegit-test-secret
      ONEGIT_TEST_REQUIRE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          fmt="$(gofmt -l .)"
          if [ -n "$fmt" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: start test services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: test
        run: go test -race -count=1 -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: service logs
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail=200

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # Informational: a new advisory in a dependency should prompt a look, not
  # block unrelated pull requests.
  vulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Pull requests: make sure the image builds and starts.
  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: onegit:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke test
        run: docker run --rm onegit:ci version

  # Every push to main publishes the "edge" image.
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, lint]
    uses: ./.github/workflows/docker.yml
    secrets: inherit
