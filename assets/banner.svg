<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-label="onegit — one repository: code, pull requests, CI, deployments and a container registry">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3f4fa"/>
      <stop offset="100%" stop-color="#e3e6f2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2046" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="28" fill="url(#canvas)"/>

  <!-- card -->
  <rect x="40" y="36" width="1120" height="208" rx="24" fill="#ffffff" filter="url(#shadow)"/>

  <!-- the logo, as in internal/web/static/favicon.svg -->
  <g transform="translate(84,70) scale(5.8)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#3b5bdb" stroke-width="2.4"/>
    <circle cx="12" cy="12" r="3.6" fill="#3b5bdb"/>
  </g>

  <text x="262" y="132" font-family="'Bricolage Grotesque', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#1b1d2b" letter-spacing="-2">onegit</text>
  <text x="264" y="172" font-family="'Onest', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#6c7089">A self-hosted home for one monorepo, in one Go binary</text>

  <!-- the navigation dock: one pill per section, in the UI's section colours -->
  <g font-family="'Onest', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="262" y="194" width="74" height="30" rx="15" fill="#3b5bdb"/>
    <text x="299" y="214" fill="#ffffff" text-anchor="middle">Code</text>
    <rect x="346" y="194" width="130" height="30" rx="15" fill="#e8f5ee"/>
    <text x="411" y="214" fill="#1a8a4b" text-anchor="middle">Pull requests</text>
    <rect x="486" y="194" width="90" height="30" rx="15" fill="#fdefe6"/>
    <text x="531" y="214" fill="#d9580b" text-anchor="middle">Actions</text>
    <rect x="586" y="194" width="130" height="30" rx="15" fill="#e8f1fc"/>
    <text x="651" y="214" fill="#2f7de1" text-anchor="middle">Deployments</text>
    <rect x="726" y="194" width="104" height="30" rx="15" fill="#f8eaf3"/>
    <text x="778" y="214" fill="#b8458b" text-anchor="middle">Packages</text>
  </g>

  <!-- decorative commit graph -->
  <g stroke="#3b5bdb" stroke-width="3" fill="none" opacity="0.18" stroke-linecap="round">
    <path d="M900 80 H1110"/>
    <path d="M950 80 C975 80 975 130 1000 130 H1060 C1085 130 1085 80 1110 80"/>
  </g>
  <g fill="#3b5bdb" opacity="0.28">
    <circle cx="900" cy="80" r="8"/>
    <circle cx="950" cy="80" r="8"/>
    <circle cx="1000" cy="130" r="8"/>
    <circle cx="1060" cy="130" r="8"/>
    <circle cx="1110" cy="80" r="10"/>
  </g>
</svg>
