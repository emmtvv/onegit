{{define "content"}}{{$d := .Data}}
<div class="toolbar">
  <span class="spacer"></span>
  <form method="get" action="/tags"><input type="search" name="q" value="{{$d.Q}}" placeholder="Filter tags" aria-label="Filter tags"></form>
</div>
<div class="box">
  {{range $d.Tags}}
  <div class="branch-row">
    {{template "icon-tag"}}<a class="branch-name" href="/tree/{{pathesc .Name}}">{{.Name}}</a>
    <span class="muted">{{.Subject}}</span>
    <span class="spacer"></span>
    <span class="muted" title="{{datetime .When}}">{{ago .When}}</span>
    <a class="btn btn-sm sha" href="/commit/{{.SHA}}">{{shortsha .SHA}}</a>
  </div>
  {{else}}
  <div class="blob-note">{{if $d.Q}}No tags match.{{else}}No tags yet.{{end}}</div>
  {{end}}
</div>
<div class="pager">
  {{if gt $d.Page 1}}<a class="btn" href="?q={{queryesc $d.Q}}&page={{sub $d.Page 1}}">Previous</a>{{end}}
  {{if $d.HasNext}}<a class="btn" href="?q={{queryesc $d.Q}}&page={{add $d.Page 1}}">Next</a>{{end}}
</div>
{{end}}
