{{define "content"}}
<div class="auth-box">
  <div class="auth-logo">{{template "icon-logo"}}</div>
  <h1>Choose a new password</h1>
  <p class="muted center">You signed in with a temporary password. Set your own password to continue.</p>
  <form method="post" action="/password/change" class="form">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <input type="hidden" name="username" value="{{.User.Username}}" autocomplete="username">
    <label>Current password<input name="current" type="password" autocomplete="current-password" required autofocus></label>
    <label>New password<input name="new" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Confirm new password<input name="confirm" type="password" autocomplete="new-password" minlength="10" required></label>
    <p class="muted small">At least 10 characters.</p>
    <button class="btn btn-primary btn-block" type="submit">Change password</button>
  </form>
  <form method="post" action="/logout" class="center"><button class="linklike" type="submit">Sign out</button></form>
</div>
{{end}}
